<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Browser</title>
<script src="boot.js"></script><link rel="stylesheet" href="wizard-tokens.css"><link rel="stylesheet" href="wizard-ui.css"><link rel="stylesheet" href="styles.css">
<script defer src="/wizard-os-home/core/app-client.js"></script><script defer src="app.js"></script></head>
<body><main class="wz-app">
<nav class="reader-mode" aria-label="Browser view"><span aria-current="page">Reader</span></nav>
<form id="address" class="wz-field-row"><input id="url" class="wz-input" name="url" type="url" aria-label="Web address" placeholder="Paste a web address" required><button class="wz-btn" type="submit">Read</button></form>
<p id="status" class="wz-muted" role="status" aria-live="polite">Open a web link or paste an address to read it here.</p>
<section id="page" hidden><div class="source"><img id="logo" alt="" width="28" height="28"><div><strong id="site"></strong><p id="source"></p></div></div>
<a id="original" class="wz-btn" data-wizard-browse target="_blank" rel="noopener noreferrer">Open in your browser</a>
<h1 id="title"></h1><p id="byline" class="wz-muted"></p><article id="article"></article></section>
</main></body></html>
